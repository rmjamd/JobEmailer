<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobEmailer Chat</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f8fb;
            --panel: #ffffff;
            --text: #18202f;
            --muted: #627086;
            --line: #d9dfeb;
            --accent: #0f766e;
            --accent-dark: #115e59;
            --user: #e8f3ff;
            --bot: #ffffff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .shell {
            width: min(920px, 100%);
            height: min(760px, calc(100vh - 48px));
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
        }

        header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 0;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: #c2410c;
        }

        .dot.online {
            background: #15803d;
        }

        main {
            padding: 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: min(680px, 92%);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .message.bot {
            background: var(--bot);
            align-self: flex-start;
        }

        .message.user {
            background: var(--user);
            border-color: #bfdbfe;
            align-self: flex-end;
        }

        form {
            border-top: 1px solid var(--line);
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            background: #fbfcff;
        }

        textarea {
            resize: none;
            min-height: 48px;
            max-height: 140px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px 13px;
            font: inherit;
            line-height: 1.35;
            color: var(--text);
            background: #fff;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 0 20px;
            min-width: 96px;
            font: inherit;
            font-weight: 650;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        button:disabled {
            cursor: not-allowed;
            background: #94a3b8;
        }

        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .shell {
                height: 100vh;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            form {
                grid-template-columns: 1fr;
            }

            button {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
<section class="shell" aria-label="JobEmailer chat">
    <header>
        <h1>JobEmailer Chat</h1>
        <span class="status"><span id="dot" class="dot"></span><span id="status">Connecting</span></span>
    </header>
    <main id="messages"></main>
    <form id="form">
        <textarea id="input" placeholder="Paste a LinkedIn post URL" autocomplete="off"></textarea>
        <button id="send" type="submit" disabled>Send</button>
    </form>
</section>

<script>
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#form");
    const input = document.querySelector("#input");
    const send = document.querySelector("#send");
    const dot = document.querySelector("#dot");
    const statusText = document.querySelector("#status");

    let socket;

    function addMessage(kind, text) {
        const el = document.createElement("div");
        el.className = `message ${kind}`;
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
    }

    function setConnected(connected) {
        dot.classList.toggle("online", connected);
        statusText.textContent = connected ? "Connected" : "Disconnected";
        send.disabled = !connected;
    }

    function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${window.location.host}/chat`);

        socket.addEventListener("open", () => setConnected(true));
        socket.addEventListener("message", event => addMessage("bot", event.data));
        socket.addEventListener("close", () => {
            setConnected(false);
            setTimeout(connect, 2000);
        });
        socket.addEventListener("error", () => setConnected(false));
    }

    form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || !socket || socket.readyState !== WebSocket.OPEN) {
            return;
        }
        addMessage("user", text);
        socket.send(text);
        input.value = "";
        input.focus();
    });

    input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    connect();
</script>
</body>
</html>
